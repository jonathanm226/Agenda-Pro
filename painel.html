<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Agenda Pro! | Painel Central</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary-color: #FF6600; --bg-color: #121212; --box-color: #1A1A1A; --text-color: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 550px; padding: 15px; padding-bottom: 90px; }
        .barber-header { text-align: center; background: var(--box-color); padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .brand-logo-container { width: 80px; height: 80px; background: var(--bg-color); border: 2px solid var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px auto; overflow: hidden; }
        .brand-logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .btn-engrenagem { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-color); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .section { margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .input-group label { font-size: 0.85rem; color: #CCC; }
        input, select, textarea { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: var(--text-color); outline: none; }
        .btn-acao { width: 100%; padding: 14px; background-color: var(--primary-color); color: #FFF; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .finance-card { background: var(--box-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .finance-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .finance-value { font-size: 1.6rem; font-weight: bold; color: #25D366; margin-bottom: 10px; }
        .week-horizontal-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; overflow-x: auto; }
        .day-column { background: var(--box-color); border-radius: 8px; padding: 5px; display: flex; flex-direction: column; gap: 5px; }
        .day-header { font-size: 0.65rem; text-align: center; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px; color: #CCC; }
        .slot-item { background: var(--bg-color); padding: 6px 4px; border-radius: 6px; font-size: 0.6rem; border-left: 3px solid #555; cursor: pointer; }
        .slot-item.booked { border-left-color: #3498db; background: rgba(52, 152, 219, 0.1); color: #FFF; font-weight: bold; }
        .slot-item.concluded { border-left-color: #25D366; background: rgba(37, 211, 102, 0.1); color: #25D366; }
        .slot-item.available { border-left-color: var(--primary-color); background: var(--box-color); color: var(--text-color); }
        .slot-item.blocked { border-left-color: #e74c3c; background: rgba(231, 76, 60, 0.1); color: #888; text-decoration: line-through; }
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .custom-modal { background: var(--box-color); color: var(--text-color); padding: 25px; border-radius: 16px; width: 95%; max-width: 520px; }
        .themes-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 15px; }
        .theme-btn { padding: 12px; border-radius: 8px; border: 2px solid transparent; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-align: left; }
        .config-card { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="app-container" id="painel-container">
        <header class="barber-header">
            <div id="admin-gear-container"></div>
            <div class="brand-logo-container"><img id="painel-logo" src="" alt="Logo" style="display:none;"></div>
            <h1 style="font-size: 1.3rem;" id="painel-nome-negocio">Carregando...</h1>
            <p style="font-size: 0.8rem; color: var(--primary-color); font-weight: 600;">Painel de Gestão</p>
        </header>
        <section id="login-section" class="section">
            <h2 style="font-size: 1.1rem; margin-bottom: 15px; text-align: center;">Acesso ao Sistema</h2>
            <div class="input-group"><label>Utilizador:</label><input type="text" id="login-usuario" placeholder="Utilizador"></div>
            <div class="input-group"><label>Palavra-passe:</label><input type="password" id="login-senha" placeholder="Palavra-passe"></div>
            <button type="button" class="btn-acao" onclick="fazerLogin()">Entrar no Painel</button>
        </section>
        <section id="dashboard-barbeiro" class="section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 id="titulo-agenda-barbeiro" style="font-size: 1rem; margin:0;"><i class="fa-solid fa-calendar-check"></i> Minha Agenda</h2>
                <button type="button" class="btn-acao" onclick="fazerLogout()" style="width: auto; padding: 8px 10px; background: rgba(231, 76, 60, 0.1); color: #e74c3c; font-size: 0.75rem;">Sair</button>
            </div>
            <div class="finance-card">
                <div class="finance-header">
                    <span style="font-size: 0.85rem; font-weight: bold; color: #CCC;">Resumo Pessoal</span>
                    <select id="filtro-financeiro-prof" onchange="atualizarFinanceiroProfissional()" style="width: 110px; padding: 4px;">
                        <option value="dia">Hoje</option><option value="semana">Esta Semana</option><option value="mes">Este Mês</option>
                    </select>
                </div>
                <div class="finance-value" id="valor-financeiro-prof">R$ 0,00</div>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                <button type="button" class="btn-acao" onclick="mudarSemana(-1)" style="font-size: 0.75rem; background: var(--box-color);"><i class="fa-solid fa-chevron-left"></i> Anterior</button>
                <button type="button" class="btn-acao" onclick="mudarSemana(1)" style="font-size: 0.75rem; background: var(--box-color);">Próxima <i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div id="grade-semanal-container" class="week-horizontal-container"></div>
        </section>
        <section id="dashboard-admin" class="section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="font-size: 1rem; margin:0;">Painel Admin</h2>
                <button type="button" class="btn-acao" onclick="fazerLogout()" style="width: auto; padding: 8px 10px; background: rgba(231, 76, 60, 0.1); color: #e74c3c; font-size: 0.75rem;">Sair</button>
            </div>
            <div class="finance-card">
                <div class="finance-header"><span>Faturamento Geral</span><select id="filtro-financeiro-admin" onchange="atualizarFinanceiroAdmin()"><option value="dia">Hoje</option><option value="semana">Esta Semana</option><option value="mes">Este Mês</option></select></div>
                <div class="finance-value" id="valor-financeiro-admin">R$ 0,00</div>
            </div>
        </section>
    </div>
    <!-- MODAL CONFIG -->
    <div id="modal-config-admin" class="custom-modal-overlay">
        <div class="custom-modal">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: var(--primary-color);">Configurações</h3>
                <button type="button" onclick="fecharConfiguracoesAdmin()" style="background: rgba(255,255,255,0.1); border: none; color: #FFF; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="display: flex; gap: 4px; margin-bottom: 15px;">
                <button type="button" class="tab-btn active" onclick="mudarTabConfig('perfil', this)" style="flex: 1; padding: 8px; font-size: 0.75rem; background: var(--primary-color); color: #FFF; border: none; border-radius: 6px;">1. Perfil</button>
                <button type="button" class="tab-btn" onclick="mudarTabConfig('visual', this)" style="flex: 1; padding: 8px; font-size: 0.75rem; background: transparent; color: #AAA; border: none; border-radius: 6px;">2. Visual</button>
                <button type="button" class="tab-btn" onclick="mudarTabConfig('equipa', this)" style="flex: 1; padding: 8px; font-size: 0.75rem; background: transparent; color: #AAA; border: none; border-radius: 6px;">3. Equipa</button>
                <button type="button" class="tab-btn" onclick="mudarTabConfig('servicos', this)" style="flex: 1; padding: 8px; font-size: 0.75rem; background: transparent; color: #AAA; border: none; border-radius: 6px;">4. Serviços</button>
            </div>
            <div id="tab-perfil" class="config-tab-content">
                <div class="config-card">
                    <div class="input-group"><label>Nome da Empresa:</label><input type="text" id="config-nome-empresa"></div>
                    <div class="input-group"><label>Contato Admin (WhatsApp):</label><input type="text" id="config-admin-contato"></div>
                </div>
                <button type="button" class="btn-acao" onclick="mudarTabConfig('visual', document.querySelectorAll('.tab-btn')[1])">Avançar</button>
            </div>
            <div id="tab-visual" class="config-tab-content" style="display: none;">
                <div class="config-card">
                    <h4 style="margin-bottom: 10px; color: var(--primary-color);">10 Temas Visuais</h4>
                    <div class="themes-grid">
                        <button type="button" class="theme-btn" style="background:#121212; border-color:#FF6600; color:#FFF;" onclick="aplicarCores('#FF6600','#121212','#1A1A1A','#FFF')">1. Padrão Escuro (Laranja)</button>
                        <button type="button" class="theme-btn" style="background:#FFF0F5; border-color:#FF69B4; color:#1F2937;" onclick="aplicarCores('#FF69B4','#FFF0F5','#FFF','#1F2937')">2. Salão Estética (Rosa)</button>
                        <button type="button" class="theme-btn" style="background:#F0FDF4; border-color:#22C55E; color:#1F2937;" onclick="aplicarCores('#22C55E','#F0FDF4','#FFF','#1F2937')">3. Saúde e Clínica (Verde)</button>
                        <button type="button" class="theme-btn" style="background:#09090B; border-color:#E11D48; color:#FAFAFA;" onclick="aplicarCores('#E11D48','#09090B','#18181B','#FAFAFA')">4. Estúdio Moderno (Vermelho)</button>
                        <button type="button" class="theme-btn" style="background:#0F172A; border-color:#3B82F6; color:#F8FAFC;" onclick="aplicarCores('#3B82F6','#0F172A','#1E293B','#F8FAFC')">5. Oceano Profundo (Azul)</button>
                        <button type="button" class="theme-btn" style="background:#1C1917; border-color:#D97706; color:#FAFAF9;" onclick="aplicarCores('#D97706','#1C1917','#292524','#FAFAF9')">6. Barbearia Clássica (Dourado)</button>
                        <button type="button" class="theme-btn" style="background:#FAFAFA; border-color:#000000; color:#111827;" onclick="aplicarCores('#000000','#FAFAFA','#FFF','#111827')">7. Minimalista Elegante (Branco)</button>
                        <button type="button" class="theme-btn" style="background:#FEF3C7; border-color:#059669; color:#064E3B;" onclick="aplicarCores('#059669','#FEF3C7','#FFFBEB','#064E3B')">8. Natureza Zen (Bege)</button>
                        <button type="button" class="theme-btn" style="background:#170F1E; border-color:#A855F7; color:#F3E8FF;" onclick="aplicarCores('#A855F7','#170F1E','#2D1B38','#F3E8FF')">9. Roxo Neon (Roxo)</button>
                        <button type="button" class="theme-btn" style="background:#F5E6D3; border-color:#8B4513; color:#3E2723;" onclick="aplicarCores('#8B4513','#F5E6D3','#FFF8ED','#3E2723')">10. Café Vintage (Marrom)</button>
                    </div>
                    <input type="hidden" id="config-cor-primaria"><input type="hidden" id="config-cor-fundo"><input type="hidden" id="config-cor-caixas"><input type="hidden" id="config-cor-letras">
                </div>
                <button type="button" class="btn-acao" onclick="mudarTabConfig('equipa', document.querySelectorAll('.tab-btn')[2])">Avançar</button>
            </div>
            <div id="tab-equipa" class="config-tab-content" style="display: none;">
                <div class="config-card"><div id="lista-profissionais-config" style="max-height:100px; overflow-y:auto; margin-bottom:8px;"></div><input type="text" id="novo-profissional-nome" placeholder="Nome" style="margin-bottom:6px;"><input type="text" id="novo-profissional-wpp" placeholder="WhatsApp" style="margin-bottom:6px;"><button type="button" class="btn-acao" onclick="adicionarProfissional()" style="background:rgba(255,255,255,0.1);">Adicionar</button></div>
                <button type="button" class="btn-acao" onclick="mudarTabConfig('servicos', document.querySelectorAll('.tab-btn')[3])">Avançar</button>
            </div>
            <div id="tab-servicos" class="config-tab-content" style="display: none;">
                <div class="config-card"><div id="lista-servicos-config" style="max-height:100px; overflow-y:auto; margin-bottom:8px;"></div><div style="display:flex; gap:6px; margin-bottom:6px;"><input type="text" id="novo-servico-nome" placeholder="Serviço" style="flex:2;"><input type="number" id="novo-servico-preco" placeholder="R$" style="flex:1;"><input type="number" id="novo-servico-tempo" placeholder="Min" style="flex:1;"></div><button type="button" class="btn-acao" onclick="adicionarServico()" style="background:rgba(255,255,255,0.1);">Adicionar</button></div>
                <button type="button" class="btn-acao" id="btn-salvar-configs" onclick="salvarConfiguracoesGerais()" style="background:#25D366;">Guardar Tudo</button>
            </div>
        </div>
    </div>
    <!-- MODAL AÇÕES -->
    <div id="modal-acao-custom" class="custom-modal-overlay" style="z-index: 99999;">
        <div class="custom-modal" style="text-align: center; max-width: 350px;">
            <i class="fa-solid fa-circle-question" style="font-size: 2.5rem; color: var(--primary-color); margin-bottom: 15px;"></i>
            <h3 style="margin-bottom: 10px;">Confirmação</h3>
            <p id="alerta-acao-texto" style="font-size: 0.95rem; margin-bottom: 25px; color: #CCC;"></p>
            <div style="display: flex; gap: 10px;">
                <button type="button" onclick="fecharModalAcao()" style="flex:1; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: var(--text-color); cursor: pointer;">Cancelar</button>
                <button type="button" onclick="confirmarAcaoPendente()" style="flex:1; padding: 12px; border-radius: 8px; border: none; background: var(--primary-color); color: #FFF; cursor: pointer;">Confirmar</button>
            </div>
        </div>
    </div>
    <div id="modal-alerta-custom" class="custom-modal-overlay" style="z-index: 99999;">
        <div class="custom-modal" style="text-align: center; max-width: 320px;">
            <p id="alerta-custom-texto" style="font-size: 1rem; margin-bottom: 20px;"></p>
            <button type="button" class="btn-acao" onclick="fecharAlertaCustom()">Entendido</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
