<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Agenda Pro! | Painel Central</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary-color: #FF6600; 
            --bg-color: #121212;
            --box-color: #1A1A1A;
            --text-color: #FFFFFF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        .app-container { width: 100%; max-width: 550px; padding: 15px; padding-bottom: 90px; }
        
        .barber-header { text-align: center; background: var(--box-color); padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .brand-logo-container { width: 80px; height: 80px; background: var(--bg-color); border: 2px solid var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px auto; overflow: hidden; }
        .brand-logo-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .btn-engrenagem { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-color); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .btn-engrenagem:hover { border-color: var(--primary-color); color: var(--primary-color); background: rgba(255, 102, 0, 0.1); }

        .section { margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .input-group label { font-size: 0.85rem; color: #CCC; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: var(--text-color); outline: none; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary-color); background: rgba(255,255,255,0.05); }
        
        .btn-acao { width: 100%; padding: 14px; background-color: var(--primary-color); color: #FFF; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-acao:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .finance-card { background: var(--box-color); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .finance-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .finance-value { font-size: 1.6rem; font-weight: bold; color: #25D366; margin-bottom: 10px; }
        .finance-breakdown { font-size: 0.8rem; color: #AAA; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .week-horizontal-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; overflow-x: auto; padding-bottom: 5px; }
        .day-column { background: var(--box-color); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 5px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
        .day-header { font-size: 0.65rem; text-align: center; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px; margin-bottom: 4px; color: #CCC; }
        
        .slot-item { background: var(--bg-color); padding: 6px 4px; border-radius: 6px; font-size: 0.6rem; border-left: 3px solid #555; cursor: pointer; transition: 0.2s; }
        .slot-item:hover { opacity: 0.8; }
        .slot-item.booked { border-left-color: #3498db; background: rgba(52, 152, 219, 0.1); }
        .slot-item.mensalista { border-left-color: #9b59b6; background: rgba(155, 89, 182, 0.1); }
        .slot-item.concluded { border-left-color: #25D366; background: rgba(37, 211, 102, 0.1); }
        .slot-item.available { border-left-color: var(--primary-color); background: var(--box-color); }
        .slot-item.blocked { border-left-color: #e74c3c; background: rgba(231, 76, 60, 0.1); color: #888; text-decoration: line-through; }

        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .custom-modal { background: var(--box-color); color: var(--text-color); padding: 25px; border-radius: 16px; width: 95%; max-width: 520px; border: 1px solid rgba(255,255,255,0.1); max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        .themes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        .theme-btn { padding: 10px; border-radius: 8px; border: 2px solid transparent; font-size: 0.75rem; font-weight: bold; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .theme-btn:hover { transform: scale(1.02); }
        .theme-btn .color-dot { width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.5); }
        
        .config-card { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .config-card h4 { font-size: 0.95rem; color: var(--primary-color); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
    </style>
</head>
<body>

    <div class="app-container" id="painel-container">
        <header class="barber-header">
            <div id="admin-gear-container"></div>
            <div class="brand-logo-container"><img id="painel-logo" src="" alt="Logo" style="display:none;"></div>
            <h1 style="font-size: 1.3rem; margin-bottom: 4px;" id="painel-nome-negocio">Carregando...</h1>
            <p style="font-size: 0.8rem; color: var(--primary-color); font-weight: 600;">Painel de Gestão</p>
        </header>

        <!-- SESSÃO DE LOGIN -->
        <section id="login-section" class="section">
            <h2 style="font-size: 1.1rem; margin-bottom: 15px; text-align: center;">Acesso ao Sistema</h2>
            <div class="input-group">
                <label>Utilizador:</label>
                <input type="text" id="login-usuario" placeholder="Digite o seu utilizador" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" name="no-autofill-user">
            </div>
            <div class="input-group">
                <label>Palavra-passe:</label>
                <input type="password" id="login-senha" placeholder="Digite a sua palavra-passe" autocomplete="new-password" autocorrect="off" autocapitalize="none" spellcheck="false" name="no-autofill-pass">
            </div>
            <button type="button" class="btn-acao" onclick="fazerLogin()" style="margin-top: 10px;">Entrar no Painel</button>
        </section>

        <!-- DASHBOARD PROFISSIONAL / COLABORADOR -->
        <section id="dashboard-barbeiro" class="section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 id="titulo-agenda-barbeiro" style="font-size: 1rem; margin:0;"><i class="fa-solid fa-calendar-check"></i> Minha Agenda</h2>
                <div style="display: flex; gap: 6px;">
                    <button type="button" class="btn-acao" onclick="abrirModalTrocarSenha()" style="width: auto; padding: 8px 10px; background: rgba(52, 152, 219, 0.1); color: #3498db; border: 1px solid #3498db; font-size: 0.75rem;" title="Alterar Senha"><i class="fa-solid fa-key"></i></button>
                    <button type="button" class="btn-acao" onclick="fazerLogout()" style="width: auto; padding: 8px 10px; background: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid #e74c3c; font-size: 0.75rem;"><i class="fa-solid fa-power-off"></i> Sair</button>
                </div>
            </div>
            
            <div class="finance-card">
                <div class="finance-header">
                    <span style="font-size: 0.85rem; font-weight: bold; color: #CCC;">Resumo Pessoal</span>
                    <select id="filtro-financeiro-prof" onchange="atualizarFinanceiroProfissional()" style="width: 120px; padding: 6px; font-size: 0.75rem; border-radius: 6px;">
                        <option value="dia">Hoje</option>
                        <option value="semana">Esta Semana</option>
                        <option value="mes">Este Mês</option>
                    </select>
                </div>
                <div class="finance-value" id="valor-financeiro-prof">R$ 0,00</div>
            </div>

            <div style="background: var(--box-color); padding: 12px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.05);">
                <span id="label-periodo-semana" style="font-size: 0.85rem; color: var(--text-color); font-weight: bold; display: block; margin-bottom: 10px;"></span>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn-acao" onclick="mudarSemana(-1)" style="font-size: 0.75rem; background: var(--bg-color); border: 1px solid rgba(255,255,255,0.1);"><i class="fa-solid fa-chevron-left"></i> Anterior</button>
                    <button type="button" class="btn-acao" onclick="mudarSemana(1)" style="font-size: 0.75rem; background: var(--bg-color); border: 1px solid rgba(255,255,255,0.1);">Próxima <i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div id="grade-semanal-container" class="week-horizontal-container"></div>
        </section>

        <!-- DASHBOARD ADMIN -->
        <section id="dashboard-admin" class="section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="font-size: 1rem; margin:0;"><i class="fa-solid fa-chart-line"></i> Painel Admin</h2>
                <div style="display: flex; gap: 6px;">
                    <button type="button" class="btn-acao" onclick="abrirModalTrocarSenha()" style="width: auto; padding: 8px 10px; background: rgba(52, 152, 219, 0.1); color: #3498db; border: 1px solid #3498db; font-size: 0.75rem;" title="Alterar Senha"><i class="fa-solid fa-key"></i></button>
                    <button type="button" class="btn-acao" onclick="fazerLogout()" style="width: auto; padding: 8px 10px; background: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid #e74c3c; font-size: 0.75rem;"><i class="fa-solid fa-power-off"></i> Sair</button>
                </div>
            </div>
            <div class="finance-card">
                <div class="finance-header">
                    <span style="font-size: 0.85rem; font-weight: bold; color: #CCC;">Faturamento Geral</span>
                    <select id="filtro-financeiro-admin" onchange="atualizarFinanceiroAdmin()" style="width: 120px; padding: 6px; font-size: 0.75rem; border-radius: 6px;">
                        <option value="dia">Hoje</option><option value="semana">Esta Semana</option><option value="mes">Este Mês</option>
                    </select>
                </div>
                <div class="finance-value" id="valor-financeiro-admin">R$ 0,00</div>
                <div class="finance-breakdown">
                    <span>💠 Pix: <strong id="val-pix">R$ 0,00</strong></span><span>💵 Dinheiro: <strong id="val-dinheiro">R$ 0,00</strong></span>
                    <span>💳 Débito: <strong id="val-debito">R$ 0,00</strong></span><span>💳 Crédito: <strong id="val-credito">R$ 0,00</strong></span>
                </div>
            </div>
        </section>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES EM ABAS -->
    <div id="modal-config-admin" class="custom-modal-overlay">
        <div class="custom-modal">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                <h3 style="color: var(--primary-color); font-size: 1.2rem; margin:0; display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-gear"></i> Configuração do Estabelecimento</h3>
                <button type="button" onclick="fecharConfiguracoesAdmin()" style="background: rgba(255,255,255,0.1); border: none; color: #FFF; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div style="display: flex; gap: 4px; margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 8px;">
                <button type="button" class="tab-btn active" onclick="mudarTabConfig('perfil', this)" style="flex: 1; padding: 8px; font-size: 0.75rem; border-radius: 6px; border: none; background: var(--primary-color); color: #FFF; font-weight: bold; cursor: pointer; transition: 0.2s;">1. Perfil</button>
                <button type="button" class="tab-btn" onclick="mudarTabConfig('visual', this)" style="flex: 1; padding: 8px; font-size: 0.75rem; border-radius: 6px; border: none; background: transparent; color: #AAA; font-weight: bold; cursor: pointer; transition: 0.2s;">2. Visual</button>
                <button type="button" class="tab-btn" onclick="mudarTabConfig('equipa', this)" style="flex: 1; padding: 8px; font-size: 0.75rem; border-radius: 6px; border: none; background: transparent; color: #AAA; font-weight: bold; cursor: pointer; transition: 0.2s;">3. Equipa</button>
                <button type="button" class="tab-btn" onclick="mudarTabConfig('servicos', this)" style="flex: 1; padding: 8px; font-size: 0.75rem; border-radius: 6px; border:
